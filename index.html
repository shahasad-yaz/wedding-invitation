<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahshad & Ahabima - Wedding Invitation</title>
    <link rel="icon" type="image/png" href="wedding-couple.png">

     <!-- Social Media Sharing (Open Graph) -->
    <meta property="og:title" content="Shahshad & Ahabima - Wedding Invitation">
    <meta property="og:description"
        content="We are getting married! Join us on January 18, 2026 at Madavoor Palace Convention Centre.">
    <meta property="og:image" content="yaz_abi.jpeg">
    <meta property="og:url" content="https://shahasad-yaz.github.io/wedding-invitation/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Shahshad & Ahabima - Wedding Invitation">
    <meta name="twitter:description"
        content="We are getting married! Join us on January 18, 2026 at Madavoor Palace Convention Centre.">
    <meta name="twitter:image" content="yaz_abi.jpeg">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allison&family=Pinyon+Script&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-burgundy: #7B1124;
            --gold-accent: #C5A059;
            --cream-bg: #F9F9F4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--cream-bg);
            font-family: 'Playfair Display', serif;
            overflow-x: hidden;
            color: var(--text-burgundy);
        }

        /* --- INTERACTIVE LOADER --- */
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 0.5s ease-out;
        }

        #page-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-content {
            text-align: center;
        }

        .loader-title {
            font-family: 'Allison', cursive;
            font-size: 4rem;
            color: white;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
        }

        .loader-text {
            font-size: 1.2rem;
            color: var(--gold-accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* --- FALLING PETALS --- */
        #petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background-color: rgba(123, 17, 36, 0.6);
            border-radius: 150% 0 150% 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translate(0, -10vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate(100px, 110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.6)), url('love.png');
            z-index: -1;
        }

        .hero-content {
            text-align: center;
            color: white;
            z-index: 2;
            padding: 20px;
        }

        .pre-title {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .main-title {
            font-family: "Allison", cursive;
            font-size: 5rem;
            line-height: 1.2;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .date-text {
            font-size: 1.5rem;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 20px;
            display: inline-block;
            margin-top: 20px;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 12vh;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.8rem;
            animation: bounce 2s infinite;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* --- INVITATION SECTION --- */
        .invitation-section {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--cream-bg);
            min-height: 100vh;
        }

        .section-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 3rem;
            color: var(--text-burgundy);
            margin-bottom: 30px;
            text-align: center;
        }

        .invite-card-wrapper {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 40px;
            background: white;
            padding: 10px;
        }

        .invite-image {
            width: 100%;
            display: block;
        }

        /* --- ACTION BUTTONS --- */
        .actions-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 50px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background-color: var(--text-burgundy);
            color: white;
            box-shadow: 0 5px 15px rgba(123, 17, 36, 0.3);
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-burgundy);
            border: 1px solid var(--text-burgundy);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn svg {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* --- COUNTDOWN TIMER --- */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            color: white;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold-accent);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .countdown-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .main-title {
                font-size: 3.5rem;
            }
            .section-title {
                font-size: 2.5rem;
            }
            .btn {
                font-size: 0.75rem;
                padding: 12px 10px;
            }
            .countdown-number {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <!-- Interactive Loader -->
    <div id="page-loader">
        <div class="loader-content">
            <div class="loader-title">Shahshad & Ahabima</div>
            <div class="loader-text">Tap to Enter ✨</div>
        </div>
    </div>

    <!-- Falling Petals -->
    <div id="petal-container"></div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="piano.mp3" type="audio/mpeg">
    </audio>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content" data-aos="fade-up" data-aos-duration="2000">
            <p class="pre-title">The Wedding Of</p>
            <h1 class="main-title">Shahshad & Ahabima</h1>
            <p class="date-text">January 18, 2026</p>

            <div class="countdown-container">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">0</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">0</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="minutes">0</span>
                    <span class="countdown-label">Mins</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">0</span>
                    <span class="countdown-label">Secs</span>
                </div>
            </div>
        </div>
        <div class="scroll-indicator">↓</div>
    </section>

    <section class="invitation-section">
        <div class="section-title" data-aos="fade-in" data-aos-duration="1000">You are invited</div>

        <div class="invite-card-wrapper" data-aos="zoom-in-up" data-aos-duration="1500" data-aos-delay="200">
            <img src="yaz_abi.jpeg" alt="Wedding Invitation" class="invite-image">
        </div>

        <div class="actions-container" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="400">
            <a href="https://maps.app.goo.gl/n4mEiE5UdA3vsT4M6" target="_blank" class="btn btn-primary">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                </svg>
                Navigate to Venue
            </a>

            <a href="#" onclick="addToCalendar(); return false;" class="btn btn-secondary">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z" />
                </svg>
                Add to Calendar
            </a>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Music and Loader
        const music = document.getElementById('bg-music');
        const loader = document.getElementById('page-loader');
        let musicStarted = false;
        
        music.volume = 0.7;
        
        // Preload audio
        music.load();
        
        // Debug listeners
        music.addEventListener('loadeddata', () => {
            console.log('✅ Audio file loaded successfully');
        });
        
        music.addEventListener('error', (e) => {
            console.error('❌ Audio error - check if moideen.mp3 exists');
        });
        
        music.addEventListener('play', () => {
            console.log('▶️ Audio is now playing');
        });
        
        function startExperience() {
            if (musicStarted) return;
            musicStarted = true;
            
            console.log('Starting music...');
            
            // Start music
            music.play()
                .then(() => {
                    console.log('✅ Music started successfully!');
                })
                .catch(e => {
                    console.error('❌ Music play failed:', e.message);
                });
            
            // Hide loader
            loader.classList.add('hidden');
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
            
            // Initialize animations
            AOS.init({ once: true });
        }
        
        // Listen for both click and touch
        loader.addEventListener('click', startExperience);
        loader.addEventListener('touchend', startExperience);

        // Countdown
        function updateCountdown() {
            const wedding = new Date('January 18, 2026 11:00:00').getTime();
            const now = new Date().getTime();
            const gap = wedding - now;

            document.getElementById('days').textContent = Math.floor(gap / (1000 * 60 * 60 * 24));
            document.getElementById('hours').textContent = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('minutes').textContent = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('seconds').textContent = Math.floor((gap % (1000 * 60)) / 1000);
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Petals
        setInterval(() => {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * window.innerWidth + 'px';
            petal.style.width = petal.style.height = (Math.random() * 10 + 10) + 'px';
            petal.style.animationDuration = (Math.random() * 5 + 8) + 's';
            document.getElementById('petal-container').appendChild(petal);
            setTimeout(() => petal.remove(), 13000);
        }, 500);

        // Calendar
        function addToCalendar() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nSUMMARY:Shahshad & Ahabima Wedding\r\nDTSTART:20260118T053000Z\r\nDTEND:20260118T093000Z\r\nLOCATION:Madavoor Palace Auditorium\r\nEND:VEVENT\r\nEND:VCALENDAR';
                const blob = new Blob([ics], { type: 'text/calendar' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'shahshad_ahabima_wedding.ics';
                a.click();
                URL.revokeObjectURL(url);
            } else {
                window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=Shahshad+%26+Ahabima+Wedding&dates=20260118T053000Z/20260118T093000Z&location=Madavoor+Palace+Auditorium', '_blank');
            }
        }
    </script>
</body>
</html>
